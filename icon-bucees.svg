<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Pin body -->
  <path d="M20 0C9 0 0 9 0 20C0 31 20 40 20 40C20 40 40 31 40 20C40 9 31 0 20 0Z" fill="#FFD700" stroke="#B8960A" stroke-width="1.2"/>
  <!-- Face circle -->
  <circle cx="20" cy="18" r="10" fill="#fff" opacity="0.95"/>
  <!-- Ears -->
  <ellipse cx="11" cy="10" rx="4" ry="4.5" fill="#FFD700" stroke="#B8960A" stroke-width="0.8"/>
  <ellipse cx="29" cy="10" rx="4" ry="4.5" fill="#FFD700" stroke="#B8960A" stroke-width="0.8"/>
  <!-- Eyes -->
  <circle cx="16.5" cy="16.5" r="2" fill="#1a1a1a"/>
  <circle cx="23.5" cy="16.5" r="2" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="17.2" cy="15.8" r="0.6" fill="#fff"/>
  <circle cx="24.2" cy="15.8" r="0.6" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="20" cy="19.5" rx="1.6" ry="1.1" fill="#333"/>
  <!-- Buck teeth -->
  <rect x="17" y="21" width="2.8" height="3.5" rx="0.7" fill="#fff" stroke="#ddd" stroke-width="0.4"/>
  <rect x="20.2" y="21" width="2.8" height="3.5" rx="0.7" fill="#fff" stroke="#ddd" stroke-width="0.4"/>
  <line x1="20" y1="21" x2="20" y2="24.5" stroke="#ddd" stroke-width="0.4"/>
</svg>
