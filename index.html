<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tesla Map</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
      touch-action: none;
    }

    /* Map wrapper — NO CSS transition, rotation driven by rAF */
    #map-wrapper {
      position: fixed;
      width: 200vmax; height: 200vmax;
      top: 50%; left: 50%;
      transform-origin: center center;
    }
    #map { width: 100%; height: 100%; }

    .arrow-marker-icon { background: none !important; border: none !important; }
    .arrow-marker-icon svg { transform-origin: 24px 24px; }
    .poi-icon { background: none !important; border: none !important; }

    /* Cluster circles — override default style with our own */
    .marker-cluster {
      background: rgba(0,0,0,0.55) !important;
      border: 2px solid rgba(255,255,255,0.35) !important;
    }
    .marker-cluster div {
      background: rgba(255,255,255,0.15) !important;
      color: #fff !important;
      font-weight: 600 !important;
      font-size: 13px !important;
      font-family: 'Courier New', monospace !important;
    }

    /* ── HUD ──────────────────────────────────────────────── */
    #hud {
      position: fixed; top: 0; left: 0; z-index: 1000;
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 5px;
      pointer-events: none;
    }
    .hud-pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 5px 11px;
      backdrop-filter: blur(6px);
      color: #fff; font-size: 12px; line-height: 1.3;
      width: fit-content;
    }
    .hud-pill .label {
      color: rgba(255,255,255,0.4); font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .hud-pill .value {
      font-size: 14px; font-weight: 600; color: #e8f4ff;
      font-variant-numeric: tabular-nums;
    }

    /* ── Compass ─────────────────────────────────────────── */
    #north-arrow {
      position: fixed; top: 14px; right: 18px; z-index: 1000;
      width: 44px; height: 44px;
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%; backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #compass-svg { display: block; }

    /* ── Category toggle buttons ─────────────────────────── */
    #cat-toggles {
      position: fixed; top: 68px; right: 12px; z-index: 1000;
      display: flex; flex-direction: column; gap: 5px;
    }
    .cat-btn {
      height: 38px; border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.78);
      display: flex; align-items: center; justify-content: flex-start;
      gap: 7px; padding: 0 10px 0 7px;
      cursor: pointer; backdrop-filter: blur(6px);
      -webkit-tap-highlight-color: transparent;
      opacity: 0.45; white-space: nowrap;
      min-width: 44px;
    }
    .cat-btn.active { opacity: 1; border-color: rgba(255,255,255,0.65); }
    .cat-btn img { width: 24px; height: 24px; flex-shrink: 0; }
    .cat-dist {
      font-size: 12px; font-weight: 600; color: #e8f4ff;
      font-variant-numeric: tabular-nums;
      font-family: 'Courier New', monospace;
      min-width: 44px; text-align: right;
    }
    .cat-dist.no-data { color: rgba(255,255,255,0.3); font-weight: 400; }



    /* ── Pan banner ──────────────────────────────────────── */
    #pan-banner {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px; padding: 5px 16px;
      color: rgba(255,255,255,0.7); font-size: 11px;
      pointer-events: none;
      opacity: 0; transition: opacity 0.3s;
      white-space: nowrap;
    }
    #pan-banner.visible { opacity: 1; }

    /* ── Status bar ──────────────────────────────────────── */
    #status-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(0,0,0,0.85);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 5px 18px;
      display: flex; flex-direction: column; gap: 2px;
      color: rgba(255,255,255,0.5); font-size: 10px;
      pointer-events: none;
    }
    #status-row1 { display: flex; justify-content: space-between; align-items: center; }
    #status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #666; display: inline-block; margin-right: 6px;
      transition: background 0.4s;
    }
    #status-dot.acquiring { background: #f5a623; animation: pulse 1s infinite; }
    #status-dot.active    { background: #4cd964; }
    #status-dot.error     { background: #ff3b30; }
    #debug-row {
      color: rgba(255,255,200,0.6); font-size: 9px; font-family: monospace;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── POI icon counter-rotation ──────────────────────── */
    /* --map-rot is set on :root each rAF frame (in degrees).
       Counter-rotating by the same amount keeps icons upright. */
    .poi-icon img {
      transform: rotate(var(--map-rot, 0deg));
      transform-origin: center center;
    }

    /* ── POI tooltip ─────────────────────────────────────── */
    .poi-tooltip {
      background: rgba(0,0,0,0.82) !important;
      border: 1px solid rgba(255,255,255,0.2) !important;
      border-radius: 6px !important;
      color: #fff !important;
      font-size: 11px !important;
      font-family: 'Courier New', monospace !important;
      padding: 4px 8px !important;
      white-space: nowrap;
      box-shadow: none !important;
    }
    .poi-tooltip::before { display: none !important; }
  </style>
</head>
<body>

  <div id="map-wrapper"><div id="map"></div></div>

  <div id="hud">
    <div class="hud-pill">
      <span class="label">Speed</span>
      <span class="value" id="hud-speed">— mph</span>
    </div>
    <div class="hud-pill">
      <span class="label">Heading</span>
      <span class="value" id="hud-heading">—</span>
    </div>
    <div class="hud-pill">
      <span class="label">Accuracy</span>
      <span class="value" id="hud-accuracy">—</span>
    </div>
  </div>

  <div id="north-arrow">
    <svg id="compass-svg" width="28" height="28" viewBox="0 0 28 28">
      <polygon points="14,2 18,14 14,12 10,14" fill="#ff3b30"/>
      <polygon points="14,26 18,14 14,16 10,14" fill="#666"/>
      <text x="14" y="11" text-anchor="middle" fill="#fff"
            font-size="5" font-family="sans-serif" font-weight="bold">N</text>
    </svg>
  </div>

  <div id="cat-toggles"></div>

  <div id="pan-banner">Exploring — returning in <span id="pan-countdown">5</span>s</div>

  <div id="status-bar">
    <div id="status-row1">
      <span><span id="status-dot" class="acquiring"></span><span id="status-text">Acquiring GPS…</span></span>
      <span id="status-coords">—</span>
    </div>
    <div id="debug-row">gps_hdg: — | speed: — | display: —</div>
  </div>

  <script>
  /* ═══════════════════════════════════════════════════════
     CONFIG
  ═══════════════════════════════════════════════════════ */
  const CFG = {
    defaultLat:   34.6059,
    defaultLng:  -86.9833,
    defaultZoom:  17,
    minZoom:       3,
    maxZoom:      20,
    tileUrl: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    tileAttr: 'Tiles &copy; Esri',
    gpsMaxAge:    1000,
    panReturnSec: 5,
    arrowPx:      48,
    geojsonUrl:   'pois.geojson',
    // Clusters dissolve into individual pins at this zoom level
    clusterMaxZoom: 11,
  };

  /* ═══════════════════════════════════════════════════════
     POI CATEGORY DEFINITIONS
     Icons are loaded from separate SVG files: icon-{id}.svg
     To update an icon, replace the SVG file on GitHub — no code changes needed.
  ═══════════════════════════════════════════════════════ */
  const POI_CATEGORIES = {
    bucees:    { label: "Buc-ee's",    color: '#FFD700', visible: true },
    walmart:   { label: 'Walmart',      color: '#0071CE', visible: true },
    tesla:     { label: 'Supercharger', color: '#E82127', visible: true },
    carwash:   { label: 'Mr. Carwash',  color: '#00AEEF', visible: true },
    rest_stop: { label: 'Rest Stop',    color: '#4CAF50', visible: true },
  };

  // Cache of loaded Image objects keyed by catId
  const iconCache = {};

  // Returns a Leaflet divIcon using an <img> tag pointing to the SVG file.
  // The browser caches the SVG after first load so subsequent markers are free.
  function makePoiIcon(catId) {
    const sz  = 30;
    const url = `icon-${catId}.svg`;
    return L.divIcon({
      className: 'poi-icon',
      iconSize:  [sz, sz],
      iconAnchor:[sz/2, sz],
      html: `<img src="${url}" width="${sz}" height="${sz}"
                  style="display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.55))"
                  onerror="this.style.display='none'">`,
    });
  }



  /* ═══════════════════════════════════════════════════════
     MAP
  ═══════════════════════════════════════════════════════ */
  const map = L.map('map', {
    center: [CFG.defaultLat, CFG.defaultLng],
    zoom:    CFG.defaultZoom,
    minZoom: CFG.minZoom, maxZoom: CFG.maxZoom,
    zoomControl: false, attributionControl: false,
    dragging: true, scrollWheelZoom: true,
    doubleClickZoom: false, touchZoom: true,
    bounceAtZoomLimits: false, keyboard: false,
    animate: false,
  });

  L.tileLayer(CFG.tileUrl, { maxZoom: CFG.maxZoom, detectRetina: true }).addTo(map);

  /* ═══════════════════════════════════════════════════════
     ARROW MARKER
  ═══════════════════════════════════════════════════════ */
  const arrowMarker = L.marker([CFG.defaultLat, CFG.defaultLng], {
    icon: L.divIcon({
      className: 'arrow-marker-icon',
      iconSize:  [CFG.arrowPx, CFG.arrowPx],
      iconAnchor:[CFG.arrowPx/2, CFG.arrowPx/2],
      html: `<svg id="arrow-svg" width="${CFG.arrowPx}" height="${CFG.arrowPx}"
               viewBox="0 0 48 48" style="transform-origin:24px 24px;display:block;">
               <circle cx="24" cy="24" r="12"
                 fill="rgba(30,140,255,0.18)" stroke="rgba(30,140,255,0.5)" stroke-width="1.5"/>
               <polygon points="24,5 33,38 24,30 15,38"
                 fill="#1e8cff" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
               <circle cx="24" cy="24" r="3.5" fill="#fff"/>
             </svg>`,
    }),
    interactive: false, zIndexOffset: 9000,
  }).addTo(map);

  const accuracyCircle = L.circle([CFG.defaultLat, CFG.defaultLng], {
    radius: 20, color: '#1e8cff', fillColor: '#1e8cff',
    fillOpacity: 0.06, weight: 1, opacity: 0.35, interactive: false,
  }).addTo(map);

  // arrowScale tracks the Leaflet pane scale so rotationLoop can combine
  // scale + counter-rotation into a single transform on the arrow SVG.
  let arrowScale = 1;
  function updateArrowScale() {
    const mat = new DOMMatrix(window.getComputedStyle(map.getPanes().markerPane).transform);
    arrowScale = mat.a || 1;
    // Transform is applied each rAF frame in rotationLoop — no direct set here
  }
  map.on('zoom zoomend zoomstart move', updateArrowScale);

  /* ═══════════════════════════════════════════════════════
     POI — one MarkerClusterGroup per category
     Using separate cluster groups means each category
     clusters independently, and toggling one doesn't
     affect the others.
  ═══════════════════════════════════════════════════════ */
  const clusterGroups = {};

  function buildClusterGroup() {
    return L.markerClusterGroup({
      maxClusterRadius: 60,        // px — how close markers must be to cluster
      disableClusteringAtZoom: CFG.clusterMaxZoom + 1,  // individual pins above this
      spiderfyOnMaxZoom: true,     // spread overlapping pins on max zoom
      showCoverageOnHover: false,  // no polygon on hover — cleaner look
      zoomToBoundsOnClick: true,   // click cluster → zoom in to it
      chunkedLoading: true,        // add markers in batches — keeps UI responsive
      chunkInterval: 100,          // ms between batches
      chunkDelay: 50,              // ms before first batch
      iconCreateFunction: (cluster) => {
        // Simple count badge — neutral dark style
        const count = cluster.getChildCount();
        const size  = count < 10 ? 32 : count < 100 ? 36 : 40;
        return L.divIcon({
          html: `<div style="
            width:${size}px; height:${size}px; border-radius:50%;
            background:rgba(20,20,20,0.82);
            border:2px solid rgba(255,255,255,0.4);
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-size:${count < 100 ? 12 : 10}px;
            font-weight:700; font-family:sans-serif;
            box-shadow:0 2px 6px rgba(0,0,0,0.6);
          ">${count}</div>`,
          className: '',
          iconSize: [size, size],
          iconAnchor: [size/2, size/2],
        });
      },
    });
  }

  // Initialise one cluster group per category
  Object.keys(POI_CATEGORIES).forEach(id => {
    clusterGroups[id] = buildClusterGroup();
  });

  /* ═══════════════════════════════════════════════════════
     POI — load GeoJSON and populate cluster groups
     Uses chunked processing so the browser stays
     responsive while parsing thousands of features.
  ═══════════════════════════════════════════════════════ */
  // Flat array of {catId, lat, lon} for all POIs — used by nearest-distance calc.
  // Populated during chunked loading; read-only after that.
  const poiCoords = [];

  function loadPOIs(geojson) {
    const features = geojson.features || [];
    const total    = features.length;
    let   loaded   = 0;
    const CHUNK    = 500;   // features per batch

    function processChunk(start) {
      const end = Math.min(start + CHUNK, total);
      for (let i = start; i < end; i++) {
        const feat  = features[i];
        const props = feat.properties;
        const catId = props.icon || props.category;
        const group = clusterGroups[catId];
        if (!group) continue;

        const [lon, lat] = feat.geometry.coordinates;

        // Store for nearest-distance lookup (no objects — just numbers for speed)
        poiCoords.push({ c: catId, a: lat, o: lon });

        const marker = L.marker([lat, lon], { icon: makePoiIcon(catId) });
        marker.bindTooltip(props.name || catId, {
          className: 'poi-tooltip',
          direction: 'top',
          offset:    [0, -26],
        });
        group.addLayer(marker);
        loaded++;
      }

      // Update status with progress
      document.getElementById('status-text').textContent =
        `Loading POIs… ${loaded.toLocaleString()} / ${total.toLocaleString()}`;

      if (end < total) {
        // Yield to browser between chunks so UI stays responsive
        setTimeout(() => processChunk(end), 0);
      } else {
        // All done — add visible groups to map
        applyToggleState();
        document.getElementById('status-text').textContent =
          `GPS active — ${total.toLocaleString()} POIs loaded`;
      }
    }

    processChunk(0);
  }

  function applyToggleState() {
    Object.keys(POI_CATEGORIES).forEach(id => {
      const cat   = POI_CATEGORIES[id];
      const group = clusterGroups[id];
      if (cat.visible) {
        if (!map.hasLayer(group)) map.addLayer(group);
      } else {
        if (map.hasLayer(group))  map.removeLayer(group);
      }
    });
  }

  /* ── Nearest POI distance ────────────────────────────────────────────────
     Called once per GPS fix. Iterates poiCoords once, tracking the minimum
     distance per category. Haversine formula, result in miles.
     ~8000 iterations of simple arithmetic — takes <1ms on any modern CPU.
  ──────────────────────────────────────────────────────────────────────── */
  function haversineMiles(lat1, lon1, lat2, lon2) {
    const R  = 3958.8;  // Earth radius in miles
    const d  = Math.PI / 180;
    const dLat = (lat2 - lat1) * d;
    const dLon = (lon2 - lon1) * d;
    const a  = Math.sin(dLat/2) ** 2 +
               Math.cos(lat1*d) * Math.cos(lat2*d) * Math.sin(dLon/2) ** 2;
    return R * 2 * Math.asin(Math.sqrt(a));
  }

  function updateNearestDistances(lat, lon) {
    if (poiCoords.length === 0) return;

    // Track minimum distance per category
    const nearest = {};
    for (const p of poiCoords) {
      const d = haversineMiles(lat, lon, p.a, p.o);
      if (nearest[p.c] === undefined || d < nearest[p.c]) {
        nearest[p.c] = d;
      }
    }

    // Update distance labels in the toggle panel
    for (const [catId] of Object.entries(POI_CATEGORIES)) {
      const el  = document.getElementById(`dist-${catId}`);
      if (!el) continue;
      const d = nearest[catId];
      if (d === undefined) {
        el.textContent = '—';
        el.className   = 'cat-dist no-data';
      } else {
        el.textContent = d < 10
          ? `${d.toFixed(1)} mi`
          : `${Math.round(d)} mi`;
        el.className = 'cat-dist';
      }
    }
  }

  function fetchPOIs() {
    fetch(CFG.geojsonUrl)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(loadPOIs)
      .catch(err => {
        console.warn('POI load failed:', err);
        document.getElementById('status-text').textContent = 'POI file not found';
      });
  }

  /* ═══════════════════════════════════════════════════════
     CATEGORY TOGGLE BUTTONS
  ═══════════════════════════════════════════════════════ */
  function buildToggles() {
    const container = document.getElementById('cat-toggles');
    Object.entries(POI_CATEGORIES).forEach(([id, cat]) => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (cat.visible ? ' active' : '');
      btn.title = cat.label;

      // Icon image
      const img = document.createElement('img');
      img.src    = `icon-${id}.svg`;
      img.width  = 24; img.height = 24;
      img.style.display = 'block';

      // Distance label — updated by updateNearestDistances()
      const dist = document.createElement('span');
      dist.className   = 'cat-dist no-data';
      dist.textContent = '—';
      dist.id          = `dist-${id}`;

      btn.appendChild(img);
      btn.appendChild(dist);

      btn.addEventListener('click', () => {
        cat.visible = !cat.visible;
        btn.classList.toggle('active', cat.visible);
        applyToggleState();
      });
      container.appendChild(btn);
    });
  }

  /* ═══════════════════════════════════════════════════════
     HEADING STATE & rAF ROTATION LOOP
  ═══════════════════════════════════════════════════════ */
  let lastGoodHeading = 0;
  let currentSpeedMph = 0;
  let displayHeading  = 0;
  let targetHeading   = 0;

  function lerpAngle(cur, tgt, alpha) {
    let d = tgt - cur;
    while (d >  180) d -= 360;
    while (d < -180) d += 360;
    return cur + alpha * d;
  }

  function rotationLoop() {
    targetHeading  = lastGoodHeading;
    displayHeading = lerpAngle(displayHeading, targetHeading, 0.08);
    const r = -displayHeading;

    // Map wrapper rotates so heading = screen-up
    const wrapper = document.getElementById('map-wrapper');
    if (wrapper) wrapper.style.transform = `translate(-50%,-50%) rotate(${r}deg)`;

    // Compass: N marker tracks true north = same rotation as map
    const compass = document.getElementById('compass-svg');
    if (compass) compass.style.transform = `rotate(${r}deg)`;

    // Arrow: lives inside the rotating wrapper so it rotates with the map.
    // Counter-rotate by +displayHeading so it always points screen-up = travel direction.
    const arrowSvg = document.getElementById('arrow-svg');
    if (arrowSvg) arrowSvg.style.transform = `scale(${1/arrowScale}) rotate(${displayHeading}deg)`;

    // Set CSS custom property so POI icons counter-rotate and stay upright.
    // One property update per frame — GPU handles the per-element compositing.
    document.documentElement.style.setProperty('--map-rot', `${displayHeading.toFixed(2)}deg`);

    document.getElementById('debug-row').textContent =
      `gps_hdg:${lastGoodHeading.toFixed(1)}° | speed:${currentSpeedMph.toFixed(1)}mph` +
      ` | display:${displayHeading.toFixed(1)}°`;
    requestAnimationFrame(rotationLoop);
  }

  /* ═══════════════════════════════════════════════════════
     GPS
  ═══════════════════════════════════════════════════════ */
  let currentLat = CFG.defaultLat, currentLng = CFG.defaultLng;
  let firstFix   = true;
  let isPanning  = false, panReturnTimer = null, panCountdownInterval = null;

  const el = id => document.getElementById(id);

  function mpsToMph(mps) { return (mps == null || isNaN(mps)) ? 0 : mps * 2.23694; }
  function headingToCardinal(deg) {
    const d = ['N','NE','E','SE','S','SW','W','NW'];
    return d[Math.round(((deg%360)+360)%360/45)%8];
  }

  function onPosition(pos) {
    const { latitude, longitude, accuracy, heading, speed } = pos.coords;
    currentLat = latitude; currentLng = longitude;
    currentSpeedMph = mpsToMph(speed);
    if (heading != null && !isNaN(heading)) lastGoodHeading = heading;

    arrowMarker.setLatLng([latitude, longitude]);
    accuracyCircle.setLatLng([latitude, longitude]);
    accuracyCircle.setRadius(accuracy ?? 20);

    if (!isPanning)
      map.setView([latitude, longitude], firstFix ? CFG.defaultZoom : map.getZoom());
    firstFix = false;
    updateArrowScale();

    updateNearestDistances(latitude, longitude);

    el('hud-speed').textContent    = `${Math.round(currentSpeedMph)} mph`;
    el('hud-heading').textContent  = `${Math.round(targetHeading)}° ${headingToCardinal(targetHeading)}`;
    el('hud-accuracy').textContent = accuracy != null ? `±${Math.round(accuracy)} m` : '—';
    el('status-coords').textContent = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    el('status-dot').className = 'active';
    if (el('status-text').textContent === 'Acquiring GPS…')
      el('status-text').textContent = 'GPS active';
  }

  function onError(err) {
    el('status-dot').className    = 'error';
    el('status-text').textContent = `GPS error (${err.code}): ${err.message}`;
  }

  const gpsOpts = { enableHighAccuracy: true, timeout: 10000, maximumAge: CFG.gpsMaxAge };

  function startGPS() {
    if (!navigator.geolocation) {
      el('status-dot').className    = 'error';
      el('status-text').textContent = 'Geolocation not supported';
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => { onPosition(pos); navigator.geolocation.watchPosition(onPosition, onError, gpsOpts); },
      err  => { onError(err);   navigator.geolocation.watchPosition(onPosition, onError, gpsOpts); },
      gpsOpts
    );
  }

  /* ═══════════════════════════════════════════════════════
     PAN MODE
  ═══════════════════════════════════════════════════════ */
  function enterPanMode() {
    if (isPanning) { resetPanTimer(); return; }
    isPanning = true;
    el('pan-banner').classList.add('visible');
    resetPanTimer();
  }
  function resetPanTimer() {
    clearTimeout(panReturnTimer); clearInterval(panCountdownInterval);
    let secs = CFG.panReturnSec;
    el('pan-countdown').textContent = secs;
    panCountdownInterval = setInterval(() => {
      secs--;
      el('pan-countdown').textContent = Math.max(0, secs);
      if (secs <= 0) clearInterval(panCountdownInterval);
    }, 1000);
    panReturnTimer = setTimeout(returnToLocation, CFG.panReturnSec * 1000);
  }
  function returnToLocation() {
    clearTimeout(panReturnTimer); clearInterval(panCountdownInterval);
    isPanning = false;
    el('pan-banner').classList.remove('visible');
    map.setView([currentLat, currentLng], map.getZoom());
  }
  /* ── Rotated panning ──────────────────────────────────────────────────
     Leaflet drag works in its own (unrotated) coordinate space. When the
     map is rotated, a screen-up drag should pan toward screen-up — but
     Leaflet pans toward map-up (which is the heading direction, not north).
     Fix: disable Leaflet drag, handle touch ourselves, rotate the delta
     vector by -displayHeading before passing to map.panBy().
  ──────────────────────────────────────────────────────────────────── */
  map.dragging.disable();

  let dragStartX = null, dragStartY = null;
  let lastDragX  = null, lastDragY  = null;

  function rotateVector(dx, dy, angleDeg) {
    // Rotate a screen-space vector into map-space by angleDeg
    const rad = angleDeg * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    return {
      x: dx * cos - dy * sin,
      y: dx * sin + dy * cos,
    };
  }

  function onDragStart(x, y) {
    dragStartX = x; dragStartY = y;
    lastDragX  = x; lastDragY  = y;
    enterPanMode();
  }

  function onDragMove(x, y) {
    if (lastDragX === null) return;
    const screenDx = lastDragX - x;   // positive = dragged left = map moves right
    const screenDy = lastDragY - y;
    lastDragX = x; lastDragY = y;

    // Rotate the screen delta into map coordinate space.
    // The map is rotated by -displayHeading, so we rotate the drag vector
    // by -displayHeading as well to compensate.
    const rotated = rotateVector(screenDx, screenDy, displayHeading);
    map.panBy([rotated.x, rotated.y], { animate: false });
    resetPanTimer();
  }

  function onDragEnd() {
    dragStartX = null; lastDragX = null;
  }

  // Touch events (primary — Tesla touchscreen)
  const mapEl = document.getElementById('map-wrapper');
  mapEl.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      onDragStart(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  mapEl.addEventListener('touchmove', e => {
    if (e.touches.length === 1) {
      onDragMove(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  mapEl.addEventListener('touchend', onDragEnd, { passive: true });

  // Mouse events (for desktop testing)
  let mouseDown = false;
  mapEl.addEventListener('mousedown', e => {
    mouseDown = true;
    onDragStart(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', e => {
    if (mouseDown) onDragMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', () => {
    mouseDown = false;
    onDragEnd();
  });


  /* ═══════════════════════════════════════════════════════
     ZOOM BUTTONS
  ═══════════════════════════════════════════════════════ */
  function addZoomButtons() {
    const base = `position:fixed;right:18px;z-index:1000;width:44px;height:44px;
      border-radius:8px;background:rgba(0,0,0,0.72);border:1px solid rgba(255,255,255,0.2);
      color:#fff;font-size:24px;font-weight:300;cursor:pointer;backdrop-filter:blur(6px);
      display:flex;align-items:center;justify-content:center;
      -webkit-tap-highlight-color:transparent;`;
    const zIn  = document.createElement('button');
    const zOut = document.createElement('button');
    zIn.style.cssText  = base + 'bottom:86px;';
    zOut.style.cssText = base + 'bottom:136px;';
    zIn.textContent = '+'; zOut.textContent = '−';
    zIn.addEventListener('click',  () => map.setZoom(map.getZoom() + 1));
    zOut.addEventListener('click', () => map.setZoom(map.getZoom() - 1));
    document.body.appendChild(zOut);
    document.body.appendChild(zIn);
  }

  /* ═══════════════════════════════════════════════════════
     BOOT
  ═══════════════════════════════════════════════════════ */
  buildToggles();
  addZoomButtons();
  fetchPOIs();
  startGPS();
  requestAnimationFrame(rotationLoop);
  setTimeout(() => { map.invalidateSize(); updateArrowScale(); }, 300);
  window.addEventListener('resize', () => map.invalidateSize());
  </script>
</body>
</html>
