<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tesla Map</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
      touch-action: none; /* let Leaflet own all touch events */
    }

    /* ── Map wrapper ───────────────────────────────────────────────
       Oversized so corners never show during rotation.
       We rotate this element so heading = screen-up.            */
    #map-wrapper {
      position: fixed;
      width: 200vmax;
      height: 200vmax;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(0deg);
      transform-origin: center center;
      transition: transform 0.5s ease-out;
    }

    #map { width: 100%; height: 100%; }

    /* ── Location arrow ────────────────────────────────────────────
       Fixed to screen-centre, NOT inside the map element.
       This makes it zoom-proof and lets us rotate it independently. */
    #location-arrow {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(0deg);
      /* rotation updated via JS; no CSS transition so it snaps with map */
      width: 0; height: 0;          /* zero-size container */
      pointer-events: none;
      z-index: 500;
    }

    /* ── HUD ───────────────────────────────────────────────────── */
    #hud {
      position: fixed; top: 0; left: 0;
      z-index: 1000;
      padding: 14px 18px;
      display: flex; flex-direction: column; gap: 6px;
      pointer-events: none;
    }

    .hud-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 6px 12px;
      backdrop-filter: blur(6px);
      color: #fff; font-size: 13px; line-height: 1.3;
      width: fit-content;
    }
    .hud-pill .label {
      color: rgba(255,255,255,0.45); font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .hud-pill .value {
      font-size: 15px; font-weight: 600; color: #e8f4ff;
      font-variant-numeric: tabular-nums;
    }

    /* ── Compass ───────────────────────────────────────────────── */
    #north-arrow {
      position: fixed; top: 14px; right: 18px;
      z-index: 1000; width: 44px; height: 44px;
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%; backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #compass-svg { transition: transform 0.5s ease-out; }

    /* ── Re-centre button (shown while panning) ────────────────── */
    #recenter-btn {
      position: fixed; bottom: 90px; right: 18px;
      z-index: 1000;
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(30,140,255,0.9);
      border: 2px solid rgba(255,255,255,0.3);
      color: #fff; font-size: 22px;
      display: none; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 2px 12px rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
    }
    #recenter-btn.visible { display: flex; }

    /* ── Status bar ─────────────────────────────────────────────── */
    #status-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.8);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 8px 18px;
      display: flex; align-items: center; justify-content: space-between;
      color: rgba(255,255,255,0.5); font-size: 11px;
      pointer-events: none;
    }
    #status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #666; display: inline-block; margin-right: 6px;
      transition: background 0.4s;
    }
    #status-dot.acquiring { background: #f5a623; animation: pulse 1s infinite; }
    #status-dot.active    { background: #4cd964; }
    #status-dot.error     { background: #ff3b30; }

    /* Panning banner */
    #pan-banner {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px; padding: 5px 16px;
      color: rgba(255,255,255,0.7); font-size: 11px;
      pointer-events: none;
      opacity: 0; transition: opacity 0.3s;
    }
    #pan-banner.visible { opacity: 1; }

    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div id="map-wrapper">
    <div id="map"></div>
  </div>

  <!-- Fixed-position arrow centred on screen — NOT inside the map -->
  <div id="location-arrow">
    <svg width="48" height="48" viewBox="0 0 48 48"
         style="position:absolute;top:-24px;left:-24px;"
         xmlns="http://www.w3.org/2000/svg">
      <!-- Accuracy halo (visual only; real circle is on map) -->
      <circle cx="24" cy="24" r="11"
              fill="rgba(30,140,255,0.18)"
              stroke="rgba(30,140,255,0.5)" stroke-width="1.5"/>
      <!-- Arrow — tip points UP = direction of travel -->
      <polygon points="24,5 33,38 24,30 15,38"
               fill="#1e8cff" stroke="#fff"
               stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Centre dot -->
      <circle cx="24" cy="24" r="3.5" fill="#fff"/>
    </svg>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-pill">
      <span class="label">Speed</span>
      <span class="value" id="hud-speed">— mph</span>
    </div>
    <div class="hud-pill">
      <span class="label">Heading</span>
      <span class="value" id="hud-heading">—</span>
    </div>
    <div class="hud-pill">
      <span class="label">Accuracy</span>
      <span class="value" id="hud-accuracy">—</span>
    </div>
  </div>

  <!-- Compass -->
  <div id="north-arrow">
    <svg id="compass-svg" width="28" height="28" viewBox="0 0 28 28">
      <polygon points="14,2 18,14 14,12 10,14" fill="#ff3b30"/>
      <polygon points="14,26 18,14 14,16 10,14" fill="#555"/>
      <text x="14" y="11" text-anchor="middle" fill="#fff"
            font-size="5" font-family="sans-serif" font-weight="bold">N</text>
    </svg>
  </div>

  <!-- Re-centre button -->
  <button id="recenter-btn" title="Return to my location">⊕</button>

  <!-- Panning banner -->
  <div id="pan-banner">Exploring — returning in <span id="pan-countdown">5</span>s</div>

  <!-- Status bar -->
  <div id="status-bar">
    <span><span id="status-dot" class="acquiring"></span><span id="status-text">Acquiring GPS…</span></span>
    <span id="status-coords">—</span>
  </div>

  <script>
  /* ═══════════════════════════════════════════════════════════════
     CONFIG
  ═══════════════════════════════════════════════════════════════ */
  const CFG = {
    defaultLat:   34.6059,
    defaultLng:  -86.9833,
    defaultZoom:  17,
    minZoom:       3,          // allow zooming way out
    maxZoom:      20,
    tileUrl: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    tileAttr: 'Tiles &copy; Esri',
    gpsMaxAge:    1000,        // ms
    headingAlpha: 0.25,        // smoothing (higher = more responsive)
    panReturnSec: 5,           // seconds before auto-return after panning
  };

  /* ═══════════════════════════════════════════════════════════════
     MAP
  ═══════════════════════════════════════════════════════════════ */
  const map = L.map('map', {
    center:           [CFG.defaultLat, CFG.defaultLng],
    zoom:              CFG.defaultZoom,
    minZoom:           CFG.minZoom,
    maxZoom:           CFG.maxZoom,
    zoomControl:       false,
    attributionControl:false,
    // Enable dragging and touch zoom so the user can explore
    dragging:          true,
    scrollWheelZoom:   true,
    doubleClickZoom:   false,
    touchZoom:         true,    // pinch zoom
    bounceAtZoomLimits:false,
    keyboard:          false,
  });

  L.tileLayer(CFG.tileUrl, {
    attribution: CFG.tileAttr,
    maxZoom: CFG.maxZoom,
    detectRetina: true,
  }).addTo(map);

  /* ═══════════════════════════════════════════════════════════════
     ACCURACY CIRCLE  (on the map, scales with zoom as expected)
  ═══════════════════════════════════════════════════════════════ */
  const accuracyCircle = L.circle([CFG.defaultLat, CFG.defaultLng], {
    radius: 20,
    color: '#1e8cff', fillColor: '#1e8cff',
    fillOpacity: 0.06, weight: 1, opacity: 0.35,
    interactive: false,
  }).addTo(map);

  /* We do NOT add a Leaflet marker — the arrow is a fixed screen element */

  /* ═══════════════════════════════════════════════════════════════
     STATE
  ═══════════════════════════════════════════════════════════════ */
  let currentLat      = CFG.defaultLat;
  let currentLng      = CFG.defaultLng;
  let smoothedHeading = 0;
  let rawHeading      = 0;
  let firstFix        = true;
  let isPanning       = false;
  let panReturnTimer  = null;
  let panCountdownInterval = null;
  let watchId         = null;

  /* ═══════════════════════════════════════════════════════════════
     HELPERS
  ═══════════════════════════════════════════════════════════════ */
  const el = id => document.getElementById(id);

  function mpsToMph(mps) {
    return (mps == null || isNaN(mps)) ? null : Math.round(mps * 2.23694);
  }

  function headingToCardinal(deg) {
    const d = ['N','NE','E','SE','S','SW','W','NW'];
    return d[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
  }

  /* Shortest-arc heading smoothing */
  function lerpHeading(current, target, alpha) {
    let diff = target - current;
    while (diff >  180) diff -= 360;
    while (diff < -180) diff += 360;
    return current + alpha * diff;
  }

  /* ═══════════════════════════════════════════════════════════════
     ARROW + MAP ROTATION
     - Map wrapper rotates so heading points UP
     - Arrow (fixed screen centre) rotates so tip points in heading dir
     - Compass counter-rotates to always show true north
  ═══════════════════════════════════════════════════════════════ */
  function applyRotation(heading) {
    // Map rotates opposite to heading so heading = screen-up
    el('map-wrapper').style.transform =
      `translate(-50%, -50%) rotate(${-heading}deg)`;

    // Arrow: tip points in travel direction = heading degrees clockwise from north
    // Since the map is rotated -heading, and we want the arrow to point "up"
    // (which visually IS the heading direction), the arrow just points straight up (0deg).
    // BUT — we want the arrow to always point screen-up regardless of map rotation,
    // so we counter-rotate it by the same amount the map rotated.
    // Net: arrow is always pointing straight up on screen = always pointing heading direction. ✓
    el('location-arrow').style.transform =
      `translate(-50%, -50%) rotate(0deg)`;
    // (Arrow is already pointing up in SVG; map rotation makes "up" = heading)

    // Compass: rotates opposite so N marker tracks true north
    el('compass-svg').style.transform = `rotate(${-heading}deg)`;
  }

  /* ═══════════════════════════════════════════════════════════════
     PAN / EXPLORE MODE
  ═══════════════════════════════════════════════════════════════ */
  function enterPanMode() {
    if (isPanning) { resetPanTimer(); return; }
    isPanning = true;
    el('recenter-btn').classList.add('visible');
    el('pan-banner').classList.add('visible');
    resetPanTimer();
  }

  function resetPanTimer() {
    clearTimeout(panReturnTimer);
    clearInterval(panCountdownInterval);
    let secs = CFG.panReturnSec;
    el('pan-countdown').textContent = secs;
    panCountdownInterval = setInterval(() => {
      secs--;
      el('pan-countdown').textContent = secs;
      if (secs <= 0) clearInterval(panCountdownInterval);
    }, 1000);
    panReturnTimer = setTimeout(returnToLocation, CFG.panReturnSec * 1000);
  }

  function returnToLocation() {
    clearTimeout(panReturnTimer);
    clearInterval(panCountdownInterval);
    isPanning = false;
    el('recenter-btn').classList.remove('visible');
    el('pan-banner').classList.remove('visible');
    map.flyTo([currentLat, currentLng], map.getZoom(), {
      animate: true, duration: 1.2, easeLinearity: 0.5,
    });
  }

  /* Listen for any user-initiated map movement */
  map.on('dragstart touchstart', () => {
    // Only enter pan mode if user actually drags (not GPS-driven pan)
    enterPanMode();
  });

  map.on('drag', () => {
    resetPanTimer();
  });

  /* Re-centre button */
  el('recenter-btn').addEventListener('click', returnToLocation);

  /* ═══════════════════════════════════════════════════════════════
     UPDATE MAP to GPS position (only when not panning)
  ═══════════════════════════════════════════════════════════════ */
  function centerOnPosition(lat, lng, zoom) {
    if (isPanning) return;   // user is exploring — don't interrupt
    map.setView([lat, lng], zoom ?? map.getZoom(), {
      animate: !firstFix, duration: 0.4,
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     GPS HANDLER
  ═══════════════════════════════════════════════════════════════ */
  function onPosition(pos) {
    const { latitude, longitude, accuracy, heading, speed } = pos.coords;

    currentLat = latitude;
    currentLng = longitude;

    // Accuracy circle (always on map, scales with zoom)
    accuracyCircle.setLatLng([latitude, longitude]);
    accuracyCircle.setRadius(accuracy ?? 20);

    // Center map (skipped while panning)
    centerOnPosition(latitude, longitude, firstFix ? CFG.defaultZoom : undefined);
    firstFix = false;

    // Heading smoothing
    const newRaw = (heading != null && !isNaN(heading)) ? heading : rawHeading;
    rawHeading      = newRaw;
    smoothedHeading = lerpHeading(smoothedHeading, rawHeading, CFG.headingAlpha);

    applyRotation(smoothedHeading);

    // HUD
    const mph = mpsToMph(speed);
    el('hud-speed').textContent   = mph != null ? `${mph} mph` : '0 mph';
    el('hud-heading').textContent = `${Math.round(rawHeading)}° ${headingToCardinal(rawHeading)}`;
    el('hud-accuracy').textContent = accuracy != null ? `±${Math.round(accuracy)} m` : '—';
    el('status-coords').textContent = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    el('status-dot').className    = 'active';
    el('status-text').textContent = 'GPS active';
  }

  function onError(err) {
    console.warn('GPS error', err.code, err.message);
    el('status-dot').className    = 'error';
    el('status-text').textContent = `GPS error (${err.code}): ${err.message}`;
  }

  /* ═══════════════════════════════════════════════════════════════
     START GPS
  ═══════════════════════════════════════════════════════════════ */
  const gpsOpts = { enableHighAccuracy: true, timeout: 10000, maximumAge: CFG.gpsMaxAge };

  function startGPS() {
    if (!navigator.geolocation) {
      el('status-dot').className    = 'error';
      el('status-text').textContent = 'Geolocation not supported';
      return;
    }
    // getCurrentPosition first → triggers Tesla permission dialog
    navigator.geolocation.getCurrentPosition(
      pos => { onPosition(pos); watchId = navigator.geolocation.watchPosition(onPosition, onError, gpsOpts); },
      err  => { onError(err);   watchId = navigator.geolocation.watchPosition(onPosition, onError, gpsOpts); },
      gpsOpts
    );
  }

  /* ═══════════════════════════════════════════════════════════════
     ZOOM BUTTONS  (large, touch-friendly)
  ═══════════════════════════════════════════════════════════════ */
  function addZoomButtons() {
    const base = `
      position:fixed; right:18px; z-index:1000;
      width:48px; height:48px; border-radius:8px;
      background:rgba(0,0,0,0.72); border:1px solid rgba(255,255,255,0.2);
      color:#fff; font-size:24px; font-weight:300; line-height:1;
      cursor:pointer; backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
    `;
    const zIn  = document.createElement('button');
    const zOut = document.createElement('button');
    zIn.style.cssText  = base + 'bottom:86px;';
    zOut.style.cssText = base + 'bottom:140px;';
    zIn.textContent    = '+';
    zOut.textContent   = '−';
    zIn.addEventListener('click',  () => map.setZoom(map.getZoom() + 1));
    zOut.addEventListener('click', () => map.setZoom(map.getZoom() - 1));
    document.body.appendChild(zOut);
    document.body.appendChild(zIn);
  }

  /* ═══════════════════════════════════════════════════════════════
     BOOT
  ═══════════════════════════════════════════════════════════════ */
  addZoomButtons();
  startGPS();
  setTimeout(() => map.invalidateSize(), 300);
  window.addEventListener('resize', () => map.invalidateSize());
  </script>
</body>
</html>
